# /etc/fail2ban/filter.d/llama-api.conf
# Managed by OpenVox - manual edits will be overwritten
#
# Matches HTTP 401s (missing/wrong API key) in the llama-api vhost's
# dedicated access log (/var/log/nginx/llama-api-access.log, combined
# format), e.g.:
#   203.0.113.7 - - [02/Oct/2026:12:00:00 -0700] "POST /v1/chat/completions HTTP/1.1" 401 179 "-" "openai-python/1.0"
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "\S+ \S+ HTTP/[0-9.]+" 401 \d+
ignoreregex =
