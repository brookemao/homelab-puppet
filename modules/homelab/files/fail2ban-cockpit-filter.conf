# /etc/fail2ban/filter.d/cockpit.conf
# Managed by OpenVox - manual edits will be overwritten
#
# Matches Cockpit failed login attempts (PAM reports the remote host):
#   pam_unix(cockpit:auth): authentication failure; ... rhost=<ip> ...
[Definition]
failregex = ^.*pam_unix\(cockpit:auth\): authentication failure;.*rhost=<HOST>\s*$
ignoreregex =
