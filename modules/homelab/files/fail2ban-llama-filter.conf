# /etc/fail2ban/filter.d/llama.conf
# Managed by OpenVox - manual edits will be overwritten
#
# Matches HTTP 401s (failed Basic-auth logins) in the llama vhost's dedicated
# access log (/var/log/nginx/llama-access.log, combined format), e.g.:
#   203.0.113.7 - agentforce [02/Oct/2026:12:00:00 -0700] "GET / HTTP/1.1" 401 179 "-" "curl/8.0"
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "\S+ \S+ HTTP/[0-9.]+" 401 \d+
ignoreregex =
