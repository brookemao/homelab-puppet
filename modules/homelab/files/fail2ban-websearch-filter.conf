# /etc/fail2ban/filter.d/websearch.conf
# Managed by OpenVox - manual edits will be overwritten
#
# Matches HTTP 401s (missing/wrong Bearer token) in the websearch vhost's
# dedicated access log (/var/log/nginx/websearch-access.log, combined
# format), e.g.:
#   203.0.113.7 - - [02/Oct/2026:12:00:00 -0700] "POST /mcp HTTP/1.1" 401 179 "-" "node"
# CORS preflight (OPTIONS) passes without credentials and answers 204, so
# normal browser use never trips this filter.
[Definition]
failregex = ^<HOST> - \S+ \[[^\]]+\] "\S+ \S+ HTTP/[0-9.]+" 401 \d+
ignoreregex =
