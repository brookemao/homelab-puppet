---
# Hiera returns plain strings, and Puppet does not wrap them in Sensitive on its own. Without
# this, setting these keys in data/secrets.yaml fails the catalog with a type
# mismatch against Sensitive[String[1]].
lookup_options:
  llama::searxng_bearer_token:
    convert_to: "Sensitive"
  llama::basic_auth_password:
    convert_to: "Sensitive"
