---
# Common parameters for homelab baseline
homelab::manage_services: true
homelab::ddclient_install_method: 'package'
homelab::ddclient_release_tag: 'latest'
homelab::cloudflare_zone: 'brookemao.ca'
homelab::cloudflare_domains: 'homelab.brookemao.ca,mindustry.brookemao.ca,photos.brookemao.ca,cockpit.brookemao.ca,llama.brookemao.ca,llama-api.brookemao.ca,websearch.brookemao.ca,claudechats.brookemao.ca'
homelab::ddclient_replace_config: false

# Mounted read-only into the Immich server; add under Administration > External Libraries
immich::external_libraries:
  - '/mnt/parkpack/photos'

# Transcoded videos are writable; the photos bind mount remains read-only.
immich::encoded_video_location: '/mnt/immich/encoded-video'

# Bulk ML processing is done; run the plain CPU image instead of the larger -rocm image
immich::ml_acceleration: 'cpu'

# Uncensored OrcaRouter build for open-ended chat
llama::model: 'Qwen3.8-27B-Uncensored-OrcaRouter-Q6_K.gguf'
llama::service_enabled: false

# Vision encoder for the chat model
llama::mmproj: 'Qwen3.8-27B-mmproj-BF16.gguf'
